<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 読み込めるものを自分のファイルとGoogleの窓口だけに絞る（外部のスクリプトを差し込まれないように） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; media-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>ポール貸出（カメラ）</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f6f5;color:#1b1b1b}
header{background:#1f6f5c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:19px}
header button{font-size:15px;padding:8px 10px;border:0;border-radius:8px;background:#fff;color:#1f6f5c}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px}
#cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .guide{position:absolute;left:10%;right:10%;top:35%;bottom:35%;border:3px solid rgba(255,255,255,.8);border-radius:10px}
#cam .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-align:center;padding:16px}
#msg{margin-top:12px;border-radius:14px;padding:16px;font-size:24px;text-align:center;background:#fff;border:3px solid #c8cfcc;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#msg small{font-size:17px;margin-top:4px}
#msg.ok{background:#e6f2ee;border-color:#1f6f5c}
#msg.back{background:#e7eefb;border-color:#2f5fb3}
#msg.ng{background:#fdecec;border-color:#b00020;color:#b00020}
.box{margin-top:12px;background:#fff;border-radius:14px;padding:12px 16px;border:2px solid #d0d7d4}
.box .n{font-size:26px;font-weight:bold}
.box .p{font-size:17px;color:#444;margin-top:4px}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;min-width:0;font-size:22px;padding:10px;border:2px solid #c8cfcc;border-radius:10px}
button.g{font-size:17px;padding:10px 14px;border:0;border-radius:10px;background:#1f6f5c;color:#fff}
button.s{font-size:17px;padding:10px 14px;border:0;border-radius:10px;background:#999;color:#fff}
#log{margin-top:10px;font-size:15px;color:#444}
#log div{padding:5px 2px;border-bottom:1px solid #e1e6e4}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pad button{font-size:30px;height:66px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 0 #c8cfcc}
table{width:100%;border-collapse:collapse;background:#fff;font-size:17px}
td,th{padding:9px;border-bottom:1px solid #e1e6e4;text-align:left}
#busy{position:fixed;right:12px;bottom:12px;background:#1f6f5c;color:#fff;padding:8px 14px;border-radius:20px;font-size:15px;display:none}
.cand{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e1e6e4;font-size:21px}
.cand small{font-size:13px;color:#b00020}
</style>
</head>
<body>
<div id="app"></div>
<div id="busy">通信中…</div>
<script src="zxing.min.js"></script>
<script src="app.js"></script>
</body>
</html>
